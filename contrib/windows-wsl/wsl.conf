# /etc/wsl.conf inside the distro. Replace <linux-user> with your Linux user
# name. Keep the [user] section: Ubuntu's first-run setup stores the default
# user here, and without it WSL logs in as root.

[boot]
systemd=true

[user]
default=<linux-user>

# Jobs can't see or write the Windows drives...
[automount]
enabled=false

# ...or start Windows programs.
[interop]
enabled=false
appendWindowsPath=false
